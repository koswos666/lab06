name: Release Packages

on:
  push:
    tags:
      - 'v*'

jobs:
  build-packages:
    strategy:
      matrix:
        os: [ubuntu-22.04, macos-12, windows-2022]
    runs-on: ${{ matrix.os }}
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Install Linux dependencies
      if: runner.os == 'Linux'
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential cmake rpm tree

    - name: Install macOS dependencies
      if: runner.os == 'macOS'
      run: |
        brew update
        brew install cmake tree

    - name: Install Windows dependencies
      if: runner.os == 'Windows'
      run: |
        choco install cmake --installargs 'ADD_CMAKE_TO_PATH=System'
        choco install wixtoolset
      shell: powershell

    - name: Configure and build
      run: |
        mkdir build
        cd build
        cmake .. -DCMAKE_BUILD_TYPE=Release
        cmake --build . --config Release
      shell: bash

    - name: Create source archives
      run: |
        TAG_NAME=${GITHUB_REF#refs/tags/}
        git archive -o "solver-${TAG_NAME}-src.tar.gz" --prefix="solver-${TAG_NAME}/" $GITHUB_REF
        git archive -o "solver-${TAG_NAME}-src.zip" --prefix="solver-${TAG_NAME}/" $GITHUB_REF
      shell: bash

    - name: List installed files
      run: |
        cd build
        echo "=== Installed files structure ==="
        find . -type f | grep -i 'install_manifest.txt' || echo "No install manifest found"
        if [ -f install_manifest.txt ]; then
          cat install_manifest.txt
        fi
        echo "=== Directory structure ==="
        tree || ls -R
      shell: bash

    - name: Generate packages
  run: |
    cd build
    if [[ "$RUNNER_OS" == "Windows" ]]; then
      # Очистка предыдущих попыток
      rm -rf .CPack_Packages || true
      
      # Генерация с подробным логом
      cpack -G WIX --verbose --debug || (find . -name '*.log' -exec cat {} \; && exit 1)
    else
      # Остальные платформы
      cpack -G DEB && cpack -G RPM || cpack -G DragNDrop
    fi
  shell: bash

    - name: Upload artifacts
      uses: actions/upload-artifact@v4
      with:
        name: packages-${{ runner.os }}
        path: |
          build/*.deb
          build/*.rpm
          build/*.dmg
          build/*.msi
          solver-*-src.tar.gz
          solver-*-src.zip

  create-release:
    needs: build-packages
    runs-on: ubuntu-latest
    steps:
    - name: Download artifacts
      uses: actions/download-artifact@v4
      with:
        path: artifacts

    - name: Create GitHub Release
      uses: softprops/action-gh-release@v1
      with:
        tag_name: ${{ github.ref }}
        name: Solver ${{ github.ref_name }}
        files: |
          artifacts/**/*.deb
          artifacts/**/*.rpm
          artifacts/**/*.dmg
          artifacts/**/*.msi
          artifacts/**/*.tar.gz
          artifacts/**/*.zip
